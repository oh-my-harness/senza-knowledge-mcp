[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senza-knowledge-mcp"
version = "0.1.0"
description = "Team domain knowledge base — MCP-first service + admin web (Senza-based)"
requires-python = ">=3.12"
dependencies = [
    "senza-sdk>=1.2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp",
    "docling>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
senza-knowledge-mcp = "senza_knowledge_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["senza_knowledge_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
